name: Vendor Munder Difflin v0.4.4

on:
  push:
    branches:
      - vendor/munder-difflin-v0.4.4
    paths:
      - .github/workflows/vendor-munder-v0.4.4.yml

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Global Mobility AIOS
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout frozen Munder Difflin donor
        uses: actions/checkout@v4
        with:
          repository: chaitanyagiri/munder-difflin
          ref: v0.4.4
          path: .vendor-staging/munder-difflin
          fetch-depth: 1

      - name: Build AI-assistant-friendly donor snapshot
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/.vendor-staging/munder-difflin"
          DST="$GITHUB_WORKSPACE/vendor/munder-difflin/v0.4.4"
          rm -rf "$DST"
          mkdir -p "$DST"

          # Preserve source, tests, runtime helpers and architecture/reference documents.
          for path in src test resources tools scripts prototypes; do
            if [ -e "$SRC/$path" ]; then
              cp -a "$SRC/$path" "$DST/$path"
            fi
          done

          for file in \
            .gitignore \
            CHANGELOG.md \
            CODE_OF_CONDUCT.md \
            CONTRIBUTING.md \
            DESIGN.md \
            HIVE.md \
            LICENSE \
            MEMORY_GRAPH_SPEC.md \
            README.md \
            RELEASE.md \
            SECURITY.md \
            SPEC.md \
            TELEMETRY.md \
            electron-builder.yml \
            electron.vite.config.ts \
            hive \
            package-lock.json \
            package.json \
            tsconfig.json \
            tsconfig.node.json \
            tsconfig.web.json; do
            if [ -e "$SRC/$file" ]; then
              cp -a "$SRC/$file" "$DST/$file"
            fi
          done

          # Munder's LICENSE explicitly states that the bundled LimeZu pixel-art
          # assets are not MIT and are non-commercial under the bundled free license.
          # AIOS is redesigning the visual layer anyway, so do not vendor those assets.
          ATTR="$DST/src/renderer/src/assets/ATTRIBUTION.md"
          ATTR_TMP="$RUNNER_TEMP/munder-assets-attribution.md"
          if [ -f "$ATTR" ]; then
            cp "$ATTR" "$ATTR_TMP"
          fi
          rm -rf "$DST/src/renderer/src/assets"
          if [ -f "$ATTR_TMP" ]; then
            mkdir -p "$DST/src/renderer/src/assets"
            cp "$ATTR_TMP" "$DST/src/renderer/src/assets/ATTRIBUTION.md"
          fi

          # Remove generated/heavy/non-source material if it entered through a copied subtree.
          find "$DST" -type d \( -name node_modules -o -name out -o -name dist -o -name .vite -o -name .worktrees \) -prune -exec rm -rf {} + || true
          find "$DST" -type f \( -name '*.log' -o -name '.DS_Store' \) -delete || true

          UPSTREAM_COMMIT="$(git -C "$SRC" rev-parse HEAD)"
          cat > "$DST/AIOS_VENDOR_METADATA.md" <<EOF
          # Munder Difflin v0.4.4 — AIOS Vendor Metadata

          **Role:** frozen upstream technology donor / read-only reference snapshot  
          **Upstream repository:** \`chaitanyagiri/munder-difflin\`  
          **Upstream tag:** \`v0.4.4\`  
          **Upstream commit:** \`$UPSTREAM_COMMIT\`  
          **Original user-downloaded ZIP SHA-256:** \`8c7a152873f72a2ddbb2f508a02bfe49903c8feb1ba59d1aaec30befa4b6e82a\`

          ## AIOS policy

          This directory is a frozen donor snapshot. Do not gradually convert it into production AIOS code in place. Relevant capabilities are evaluated under \`docs/MUNDER_DIFFLIN_AIOS_ADOPTION_V1.md\` and ported/adapted into AIOS-owned modules behind AIOS authority, Evidence, Context Broker, Canonicalization, Command Gateway, Transparency and Organizational Immune System boundaries.

          ## Licensing boundary

          The upstream MIT license is preserved in \`LICENSE\`. Munder's own license notice states that bundled pixel-art assets under \`src/renderer/src/assets/\` originate from LimeZu and are not covered by the MIT license; the free-version assets are non-commercial. Those visual assets are intentionally **not vendored into AIOS**. The upstream attribution notice is preserved where available. AIOS will use a completely redesigned modern cartoon / 2D–2.5D Living Organization visual system.

          ## Snapshot scope

          Preserved for AI-assistant inspection: application source, tests, runtime resources, tools/scripts/prototypes, package/configuration files, and primary upstream architecture/specification documents. Heavy documentation media, website render output, release binaries, generated build output, caches and restricted visual assets are intentionally excluded.
          EOF

          mkdir -p "$GITHUB_WORKSPACE/vendor/munder-difflin"
          cat > "$GITHUB_WORKSPACE/vendor/munder-difflin/README.md" <<'EOF'
          # Munder Difflin donor snapshots

          This directory stores frozen, non-authoritative upstream donor material used by Global Mobility AIOS architecture and implementation work.

          Current snapshot: `v0.4.4/`.

          **Do not implement AIOS by editing the donor snapshot.** Treat it as read-only reference material and adapt selected capabilities into AIOS-owned modules according to `docs/MUNDER_DIFFLIN_AIOS_ADOPTION_V1.md`.
          EOF

          (
            cd "$DST"
            find . -type f -print | LC_ALL=C sort > SOURCE_MANIFEST.txt
          )

      - name: Commit frozen donor snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .vendor-staging
          # One-time importer removes itself in the resulting vendor commit.
          git rm .github/workflows/vendor-munder-v0.4.4.yml
          git add vendor/munder-difflin
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No vendor changes to commit."
            exit 0
          fi
          git commit -m "vendor: add frozen Munder Difflin v0.4.4 donor source"
          git push origin HEAD:vendor/munder-difflin-v0.4.4

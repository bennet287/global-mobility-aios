name: REA source build repeatability

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rea-build-repeatability-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  source-build:
    name: REA fresh source build (${{ matrix.build }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        build: [a, b]
    steps:
      - name: Checkout exact AIOS candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: aios
          persist-credentials: false
      - name: Checkout fixed reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: morluto/rea
          ref: 4c8dc39f439b5283b077c6aa47f262714d7c4bbd
          path: donor
          persist-credentials: false
      - name: Verify all tracked source bytes before build
        run: >-
          python aios/scripts/rea_build_repeatability.py verify-source
          --source donor
          --materials aios/apps/api/app/services/rea_catalog/build_materials.json
      - name: Set up fixed Node without dependency cache
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - name: Install fixed npm tool and locked dependencies without lifecycle scripts
        working-directory: donor
        shell: bash
        env:
          BUILD_JOB: ${{ matrix.build }}
        run: |
          set -euo pipefail
          npm_tool_root="$RUNNER_TEMP/rea-npm-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$BUILD_JOB"
          npm_cache_root="$RUNNER_TEMP/rea-cache-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$BUILD_JOB"
          test ! -e "$npm_tool_root"
          test ! -e "$npm_cache_root"
          npm install --global --prefix "$npm_tool_root" npm@11.16.0 --ignore-scripts --no-audit --no-fund --cache "$npm_cache_root/tool"
          node "$npm_tool_root/lib/node_modules/npm/bin/npm-cli.js" ci --ignore-scripts --no-audit --no-fund --cache "$npm_cache_root/dependencies"
      - name: Compile directly with locked TypeScript; no donor generators or app execution
        working-directory: donor
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- dist .cache
          node node_modules/typescript/bin/tsc -p tsconfig.build.json
      - name: Verify source again and capture actual output bytes
        shell: bash
        env:
          BUILD_JOB: ${{ matrix.build }}
        run: |
          set -euo pipefail
          npm_tool_root="$RUNNER_TEMP/rea-npm-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$BUILD_JOB"
          python aios/scripts/rea_build_repeatability.py capture \
            --source donor --materials aios/apps/api/app/services/rea_catalog/build_materials.json \
            --candidate "$CANDIDATE_SHA" --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --job "$BUILD_JOB" \
            --node "$(command -v node)" --npm-cli "$npm_tool_root/lib/node_modules/npm/bin/npm-cli.js" \
            --workflow aios/.github/workflows/rea-build-repeatability.yml --output "rea-build-$BUILD_JOB"
      - name: Upload bounded compiled bytes and manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rea-build-${{ matrix.build }}
          path: rea-build-${{ matrix.build }}/
          if-no-files-found: error
          retention-days: 14

  compare:
    name: Compare received REA build bytes
    needs: source-build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact AIOS candidate; no donor or compiler in comparison job
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: aios
          persist-credentials: false
      - name: Download first build from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: rea-build-a
          path: received-a
      - name: Download independent second build from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: rea-build-b
          path: received-b
      - name: Compare complete actual manifests and received file bytes
        shell: bash
        run: |
          set -euo pipefail
          python aios/scripts/rea_build_repeatability.py compare \
            --a received-a --b received-b \
            --materials aios/apps/api/app/services/rea_catalog/build_materials.json \
            --candidate "$CANDIDATE_SHA" --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --workflow aios/.github/workflows/rea-build-repeatability.yml --output rea-repeatability.json
      - name: Preserve comparison evidence without granting runtime authority
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rea-repeatability
          path: rea-repeatability.json
          if-no-files-found: error
          retention-days: 14

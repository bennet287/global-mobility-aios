name: REA source build repeatability

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rea-build-repeatability-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  source-build-a:
    name: REA fixed authenticated compiler lane a
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/rea-source-build-a.yml
    permissions:
      contents: read
      id-token: write
      attestations: write

  source-build-b:
    name: REA fixed authenticated compiler lane b
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/rea-source-build-b.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
  compare:
    name: Compare received REA build bytes
    needs: [source-build-a, source-build-b]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Forked PRs never receive attestation privileges or a privileged fallback.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout exact AIOS candidate; no compiler in comparison job
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: aios
          persist-credentials: false
      - name: Download first build from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: rea-build-a
          path: received-a
      - name: Download independent second build from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: rea-build-b
          path: received-b
      - name: Compare complete actual manifests and received file bytes
        shell: bash
        run: |
          set -euo pipefail
          python aios/scripts/rea_build_repeatability.py compare \
            --a received-a --b received-b \
            --materials aios/apps/api/app/services/rea_catalog/build_materials.json \
            --candidate "$CANDIDATE_SHA" --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --workflow aios/.github/workflows/rea-build-repeatability.yml --output rea-repeatability.json
      - name: Preserve comparison evidence without granting runtime authority
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rea-repeatability
          path: rea-repeatability.json
          if-no-files-found: error
          retention-days: 14
      - name: Checkout fixed source assets for diagnostic package assembly
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: morluto/rea
          ref: 4c8dc39f439b5283b077c6aa47f262714d7c4bbd
          path: donor
          persist-credentials: false
      - name: Assemble complete source assets and received compiled output bytes
        shell: bash
        run: |
          set -euo pipefail
          python aios/scripts/rea_build_repeatability.py package \
            --source donor --a received-a --b received-b \
            --materials aios/apps/api/app/services/rea_catalog/build_materials.json \
            --candidate "$CANDIDATE_SHA" --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --workflow aios/.github/workflows/rea-build-repeatability.yml --output rea-package-correlation
      - name: Preserve diagnostic package and correlation report; no execution grant
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rea-package-correlation
          path: rea-package-correlation/
          if-no-files-found: error
          retention-days: 14
      - name: Attest exact correlation report after inert package assembly
        id: correlation-attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: rea-package-correlation/correlation.json
      - name: Snapshot bounded raw bundle before verifier output exists
        shell: bash
        env:
          RAW_BUNDLE: ${{ steps.correlation-attestation.outputs.bundle-path }}
        run: |
          set -euo pipefail
          python - <<'PYCODE'
          import os
          from pathlib import Path
          import sys
          sys.path.insert(0, "aios/scripts")
          from rea_ci_attestation import MAX_JSON, snapshot
          from rea_build_repeatability import parse_json
          raw, _ = snapshot(Path(os.environ["RAW_BUNDLE"]), MAX_JSON)
          parse_json(raw)
          output = Path("rea-ci-attestation-raw")
          output.mkdir(mode=0o700)
          (output / "bundle.json").write_bytes(raw)
          PYCODE
      - name: Preserve raw signature independently of verification success
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rea-ci-attestation-raw
          path: rea-ci-attestation-raw/
          if-no-files-found: error
          retention-days: 14
      - name: Checkout actual executing workflow revision for byte correlation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.workflow_sha }}
          path: ci-workflow
          persist-credentials: false
      - name: Download fixed GitHub CLI archive for fresh signature verification
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 --location --fail --silent --show-error \
            --connect-timeout 10 --max-time 60 --max-filesize 67108864 \
            https://github.com/cli/cli/releases/download/v2.102.0/gh_2.102.0_linux_amd64.tar.gz \
            --output gh-cli.tar.gz
      - name: Verify raw signed subject freshly without promoting product authority
        shell: bash
        env:
          CI_SOURCE_SHA: ${{ github.sha }}
          CI_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          python aios/scripts/rea_ci_attestation.py \
            --subject rea-package-correlation/correlation.json --bundle rea-ci-attestation-raw/bundle.json \
            --cli-archive gh-cli.tar.gz --candidate-root aios --workflow-root ci-workflow \
            --candidate "$CANDIDATE_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --source-sha "$CI_SOURCE_SHA" --workflow-sha "$CI_WORKFLOW_SHA" \
            --source-ref "$GITHUB_REF" --trigger "$GITHUB_EVENT_NAME" --output rea-ci-attestation
      - name: Preserve raw signature bundle and diagnostic verification separately
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rea-ci-attestation
          path: rea-ci-attestation/
          if-no-files-found: error
          retention-days: 14

  verify-attestation:
    name: Independently verify received REA report signature
    needs: compare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout exact reviewed candidate verifier
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: aios
          persist-credentials: false
      - name: Checkout actual executing workflow revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.workflow_sha }}
          path: ci-workflow
          persist-credentials: false
      - name: Download report bytes from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: rea-package-correlation
          path: received-package
      - name: Download raw signature bundle from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: rea-ci-attestation-raw
          path: received-attestation
      - name: Download exact compiler a manifest and inert output bytes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: rea-build-a
          path: received-compiler-a
      - name: Download compiler a raw signature
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: rea-compiler-attestation-a
          path: received-compiler-signature-a
      - name: Download exact compiler b manifest and inert output bytes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: rea-build-b
          path: received-compiler-b
      - name: Download compiler b raw signature
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: rea-compiler-attestation-b
          path: received-compiler-signature-b
      - name: Download fixed GitHub CLI archive in independent job
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 --location --fail --silent --show-error \
            --connect-timeout 10 --max-time 60 --max-filesize 67108864 \
            https://github.com/cli/cli/releases/download/v2.102.0/gh_2.102.0_linux_amd64.tar.gz \
            --output gh-cli.tar.gz
      - name: Freshly authenticate received report and bundle; ignore producer verdict JSON
        shell: bash
        env:
          CI_SOURCE_SHA: ${{ github.sha }}
          CI_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          python aios/scripts/rea_ci_attestation.py \
            --subject received-package/correlation.json --bundle received-attestation/bundle.json \
            --cli-archive gh-cli.tar.gz --candidate-root aios --workflow-root ci-workflow \
            --candidate "$CANDIDATE_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --source-sha "$CI_SOURCE_SHA" --workflow-sha "$CI_WORKFLOW_SHA" \
            --source-ref "$GITHUB_REF" --trigger "$GITHUB_EVENT_NAME" --output rea-ci-attestation-independent
      - name: Install constrained trusted AIOS verifier dependencies
        run: python -m pip install -r aios/apps/api/requirements.txt -c aios/apps/api/constraints.txt
      - name: Authenticate actual raw evidence with trusted product verifier
        shell: bash
        env:
          CI_SOURCE_SHA: ${{ github.sha }}
          CI_WORKFLOW_SHA: ${{ github.workflow_sha }}
          APPROVED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PYTHONPATH: aios/apps/api
        run: |
          set -euo pipefail
          python - <<'PYCODE'
          import os
          from pathlib import Path
          from types import SimpleNamespace
          from app.schemas_organization_rea_admission import ReaCiAttestationEvidence, ReaCiSourceRelationEvidence, ReaCompilerOutputsEvidence, ReaCompilerLaneEvidence
          from app.services import organization_rea_ci_attestation as trusted
          custody = Path("trusted-verifier-custody").absolute()
          custody.mkdir(mode=0o700)
          inputs = {"correlation.json": Path("received-package/correlation.json"),
                    "bundle.json": Path("received-attestation/bundle.json"),
                    "cli.tar.gz": Path("gh-cli.tar.gz")}
          for lane in ("a", "b"):
              inputs[f"compiler-{lane}-manifest.json"] = Path(f"received-compiler-{lane}/manifest.json")
              inputs[f"compiler-{lane}-bundle.json"] = Path(f"received-compiler-signature-{lane}/bundle.json")
          # No source package import, native application or REA provider execution.
          import sys
          sys.path.insert(0, "aios/scripts")
          from rea_ci_attestation import snapshot, export_source_witness
          from app.services import organization_rea_source_relation as relation
          witness = export_source_witness(Path("aios"), Path("ci-workflow"),
              os.environ["CANDIDATE_SHA"], os.environ["CI_SOURCE_SHA"], compiler_outputs=True)
          (custody / "source-witness.json").write_bytes(witness)
          (custody / "source-witness.json").chmod(0o444)
          for name, source in inputs.items():
              raw, _ = snapshot(source, trusted.MAX_ARCHIVE if name == "cli.tar.gz" else trusted.MAX_JSON)
              if len(raw) > (trusted.MAX_ARCHIVE if name == "cli.tar.gz" else trusted.MAX_JSON):
                  raise ValueError("raw custody size bound")
              target = custody / name
              target.write_bytes(raw)
              target.chmod(0o444)
          custody.chmod(0o555)
          source_pins = ReaCiSourceRelationEvidence(witness_sha256=trusted.sha(witness),
              reviewed_verifier_sha256=trusted.sha(snapshot(Path("aios/scripts/rea_ci_attestation.py"), trusted.MAX_JSON)[0]),
              approved_base_sha=os.environ["APPROVED_BASE_SHA"] or None)
          from app.services import organization_rea_compiler_outputs as compiler
          lane_pins = {}
          lane_trust = {}
          for lane in ("a", "b"):
              lane_pins[lane] = ReaCompilerLaneEvidence(
                  manifest_sha256=trusted.sha((custody / f"compiler-{lane}-manifest.json").read_bytes()),
                  bundle_sha256=trusted.sha((custody / f"compiler-{lane}-bundle.json").read_bytes()),
                  workflow_sha256=trusted.sha(snapshot(Path(f"aios/.github/workflows/rea-source-build-{lane}.yml"), trusted.MAX_JSON)[0]))
              lane_trust[lane] = compiler.ReaCompilerLaneTrust(custody, f"compiler-{lane}-manifest.json",
                  custody, f"compiler-{lane}-bundle.json", **lane_pins[lane].model_dump(mode="json"))
          approved = ReaCiAttestationEvidence(
              source_relation=source_pins, compiler_outputs=ReaCompilerOutputsEvidence(**lane_pins),
              bundle_sha256=trusted.sha((custody / "bundle.json").read_bytes()),
              ci_source_sha=os.environ["CI_SOURCE_SHA"], ci_workflow_sha=os.environ["CI_WORKFLOW_SHA"],
              source_ref=os.environ["GITHUB_REF"], trigger=os.environ["GITHUB_EVENT_NAME"])
          deployment = trusted.ReaCiAttestationTrust(custody, "bundle.json", custody, "cli.tar.gz",
              **{key: getattr(approved, key) for key in ("bundle_sha256", "ci_source_sha", "ci_workflow_sha", "source_ref", "trigger")},
              source_relation=relation.ReaCiSourceRelationTrust(custody, "source-witness.json", **source_pins.model_dump(mode="json")),
              compiler_outputs=compiler.ReaCompilerOutputsTrust(**lane_trust))
          compilation = SimpleNamespace(ci_attestation=deployment, report_root=custody,
              report_relative="correlation.json", report_sha256=trusted.sha((custody / "correlation.json").read_bytes()),
              candidate_sha=os.environ["CANDIDATE_SHA"], run_id=os.environ["GITHUB_RUN_ID"],
              run_attempt=os.environ["GITHUB_RUN_ATTEMPT"],
              workflow_sha256=trusted.sha(snapshot(Path("aios/.github/workflows/rea-build-repeatability.yml"), trusted.MAX_JSON)[0]),
              helper_sha256=trusted.sha(snapshot(Path("aios/scripts/rea_build_repeatability.py"), trusted.MAX_JSON)[0]))
          summary, fresh = trusted.authenticate(compilation, approved)
          fresh()
          output = Path("rea-ci-attestation-product")
          output.mkdir(mode=0o700)
          import json
          (output / "diagnostic.json").write_text(json.dumps(summary, sort_keys=True))
          (output / "source-witness.json").write_bytes(witness)
          for lane in ("a", "b"):
              for kind in ("manifest", "bundle"):
                  name = f"compiler-{lane}-{kind}.json"
                  (output / name).write_bytes((custody / name).read_bytes())
          PYCODE
      - name: Preserve trusted product verifier cryptographic diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rea-ci-attestation-product
          path: rea-ci-attestation-product/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve independently fresh diagnostic signature verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rea-ci-attestation-independent
          path: rea-ci-attestation-independent/
          if-no-files-found: error
          retention-days: 14

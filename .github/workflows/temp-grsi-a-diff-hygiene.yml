name: Temporary GRSI.A diff hygiene

on:
  push:
    branches:
      - docs/grsi-canonical-owner-audit-a

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/grsi-canonical-owner-audit-a
          fetch-depth: 1

      - name: Remove introduced trailing whitespace and cleanup helper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/aios-v2/AIOS_V2_GRSI_CANONICAL_OWNER_AUDIT_2026-10-01.md')
          text = path.read_text(encoding='utf-8')
          cleaned = '\n'.join(line.rstrip() for line in text.split('\n'))
          path.write_text(cleaned, encoding='utf-8')
          PY
          git rm .github/workflows/temp-grsi-a-diff-hygiene.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/aios-v2/AIOS_V2_GRSI_CANONICAL_OWNER_AUDIT_2026-10-01.md
          git commit -m 'Normalize GRSI.A audit diff hygiene'
          git push origin HEAD:docs/grsi-canonical-owner-audit-a

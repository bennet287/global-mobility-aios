name: Temporary GRSI roadmap insertion

on:
  push:
    branches:
      - docs/governed-recursive-self-improvement-roadmap

permissions:
  contents: write

jobs:
  insert-roadmap-programme:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/governed-recursive-self-improvement-roadmap
          fetch-depth: 1

      - name: Insert governed recursive self-improvement programme
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          roadmap = Path("docs/ROADMAP.md")
          staged = Path("docs/.grsi-roadmap-section.tmp.md")
          text = roadmap.read_text(encoding="utf-8")
          marker = "## 8A. Governed Recursive Self-Improvement (GRSI) — CORE STRATEGIC PROGRAMME"
          if marker in text:
              raise SystemExit("GRSI programme already present")
          anchor = "\n---\n\n## 9. Platform capability expansion"
          if anchor not in text:
              raise SystemExit("roadmap insertion anchor not found")
          section = staged.read_text(encoding="utf-8").rstrip() + "\n"
          roadmap.write_text(text.replace(anchor, "\n" + section + anchor, 1), encoding="utf-8")
          PY

      - name: Commit roadmap change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ROADMAP.md
          git diff --cached --check
          git commit -m "Add governed recursive self-improvement roadmap programme"
          git push origin HEAD:docs/governed-recursive-self-improvement-roadmap

name: Temporary GRSI roadmap insertion

on:
  push:
    branches:
      - docs/governed-recursive-self-improvement-roadmap

permissions:
  contents: write

jobs:
  insert-roadmap-programme:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/governed-recursive-self-improvement-roadmap
          fetch-depth: 1

      - name: Insert governed recursive self-improvement programme
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/ROADMAP.md")
          text = path.read_text(encoding="utf-8")
          marker = "## 8A. Governed Recursive Self-Improvement (GRSI) — CORE STRATEGIC PROGRAMME"
          if marker in text:
              raise SystemExit("GRSI programme already present")

          anchor = "\n---\n\n## 9. Platform capability expansion"
          if anchor not in text:
              raise SystemExit("roadmap insertion anchor not found")

          section = r'''
---

## 8A. Governed Recursive Self-Improvement (GRSI) — CORE STRATEGIC PROGRAMME

### 8A.1 Programme outcome

Governed Recursive Self-Improvement is a defining AIOS capability. The destination is not merely an organization in which agents automate assigned work. AIOS should become an **AI-native organization that continuously designs, tests, validates and improves its own AI workforce and improvement machinery**: engineering agents improving engineering agents, domain teams improving specialist agents, QA/evaluation agents building stronger tests, security/red-team agents attacking proposed improvements, and governance deciding what is allowed to become active.

The recursive property is intentional:

```text
Generation N AI
  → designs / implements / evaluates a candidate Generation N+1 AI
  → N+1 demonstrates measurable improvement under independent evidence
  → N+1 is promoted through governed gates
  → N+1 becomes part of the organization that designs N+2
  → repeat
```

This is **governed recursive self-improvement**, not unrestricted self-modification. AIOS should progressively become better at designing, validating and operating the AI workers that perform the next improvement cycle.

The permanent architectural invariant is:

> **AIOS may recursively improve its capabilities, but it may never autonomously rewrite or expand its authority.**

Equivalent operational law:

> **Capability can recursively improve. Authority cannot recursively self-expand.**

A more capable candidate does not inherit new credentials, permissions, tools, autonomy, budget, deployment rights or external-action authority merely because it performs better. Capability, authority, autonomy, risk and resource allocation remain separate canonical concerns.

GRSI must reuse existing AIOS owners rather than create a disconnected self-improvement subsystem. Existing governed work, contributions, decisions, skills, agent lifecycle/runtime, replay, learning reproducibility, observability, autonomy evidence/evaluation, promotion policy, human-action gates, security controls and economic controls remain canonical where they already own the required truth.

### 8A.2 Governed recursive improvement loop

The target organization-level loop is:

```text
AIOS OBSERVES ITSELF
  → detects weakness / opportunity / regression / bottleneck
  → opens a governed improvement objective
  → AI Research / Engineering proposes one or more candidates
  → Architecture designs the candidate boundary
  → Builder / Engineering agents implement the candidate
  → independent QA / Evaluation compares current vs candidate
  → Security / Red Team attacks the candidate
  → domain specialists validate domain quality
  → Platform / SRE validates reliability and operability
  → GRC / Governance validates required controls and evidence
  → authorized Human / governance decision admits shadow or canary
  → measured shadow / canary evidence is collected
  → promotion, rejection or rollback is decided
  → production observations feed the next improvement generation
  → repeat
```

The mature system should not require a human to identify every improvement target. Observatory, incidents, user feedback, evaluation failures, corrections/overrides, latency, reliability, cost, security findings, provider quality and team outcomes should be able to create **bounded improvement proposals** when policy permits. Observation may open an improvement objective; it does not directly mutate the active agent or policy.

Examples of legitimate future triggers include:

- a regulatory-research agent begins missing a measurable class of exceptions after a source-format change;
- an engineering agent creates materially more CI regressions than its accepted baseline;
- a collaboration workflow consumes materially more tokens without improving outcome quality;
- QA/evaluation agents fail to detect defects later found in production;
- a security agent develops unacceptable false negatives or false positives;
- a case-work agent repeatedly requires the same human correction;
- a model/provider route becomes slower, more expensive or less reliable for the same accepted quality level.

Every trigger remains evidence, not permission to self-modify.

### 8A.3 Improvement proposal and candidate lineage

AIOS must improve through **versioned candidates**, never by silently editing the active system in place.

A future durable improvement candidate should be able to identify at minimum:

- improvement objective / problem statement;
- target capability, agent, skill, workflow, policy-neutral runtime configuration or code surface;
- parent/current version or exact baseline fingerprint;
- candidate version/fingerprint and exact change/diff reference;
- proposer identity and originating department/team;
- implementing agent/team and implementation evidence;
- model/provider/runtime used to generate material candidate work where relevant;
- explicit hypothesis and expected improvement;
- acceptance criteria and regression constraints;
- evaluation dataset/case-set identity and version;
- independent evaluator identities;
- security/red-team and domain-validation evidence requirements;
- latency, reliability and cost evidence where relevant;
- shadow/canary scope and duration where required;
- rollback/revocation plan;
- promotion/rejection decision and authority source;
- resulting production version and subsequent observed outcomes.

Candidate lineage must support reconstructing how `vN` became `vN+1` and why. A candidate record is evidence of a proposed capability change; it is never an authority grant.

### 8A.4 AI designs the candidate

Engineering and AI agents may propose or implement improvements to bounded capability artifacts, including:

- agent instructions and reasoning/task-decomposition strategies;
- native skills and skill composition;
- context construction and retrieval strategy;
- memory/retrieval use policies that do not redefine canonical truth;
- workflows and collaboration/handoff patterns;
- model profiles, provider selection and model-routing strategy;
- evaluation suites and adversarial test generation;
- tool adapters and tool-use strategy within existing authority boundaries;
- software code, configuration and architecture changes;
- organizational team composition or temporary improvement-team proposals;
- later, when data/governance/infrastructure justify it, fine-tuning or training recipes and model artifacts.

Generated changes remain candidates. Existing code review, CI, security, policy, deployment, authority and runtime gates remain authoritative.

### 8A.5 Independent AI evaluates AI

The author of a candidate must not be its sole evaluator or sole source of acceptance evidence.

QA/evaluation agents should compare **current vs candidate** using immutable/versioned evidence appropriate to the capability: deterministic tests, historical replay, labelled cases, generated adversarial cases, domain benchmarks, failure cases, security tests, latency, reliability, cost and safety regressions. Existing replay, training-case generation, learning reproducibility and autonomy-evidence infrastructure should be reused where truthful.

Evaluation independence is a control boundary, not merely a second model call. A candidate author cannot choose an easier benchmark after observing failures, silently remove failing cases, change the promotion threshold, or declare its own evidence sufficient. Changes to evaluation infrastructure are themselves improvement candidates and must be versioned and reviewed.

A second model agreeing with the first is not automatically independent evidence. Deterministic verification, independently controlled evaluators, authoritative domain evidence and separately governed review remain distinct evidence classes.

### 8A.6 Cross-team attack and validation

GRSI is organization-wide, not an AI/ML-team-only loop.

- **Engineering / Architecture** designs and implements candidate capabilities and code changes.
- **QA / Evaluation** owns independent regression, benchmark and comparison evidence.
- **Security / Red Team / AppSec** tests prompt injection, privilege/permission escalation, data leakage, unsafe tool use, compromised dependency behavior and other relevant attack paths.
- **GRC / Governance** checks policy/control requirements and promotion evidence without converting mapping/review into a false compliance claim.
- **Platform / SRE** tests reliability, resource behavior, failure/recovery, observability and deployability.
- **Mobility Intelligence / Operations / Legal-domain specialists** validate factual and professional-domain behavior for mobility capabilities.
- **Product / Design / Research** validates user experience, usability, accessibility and product outcome quality.
- **Finance / economic controls** validates cost and resource implications without allowing estimated savings to become spending authority.

The central Data & AI Engineering / AI-ML Platform capability should provide reusable candidate/evaluation infrastructure. Each department remains responsible for the domain-specific acceptance evidence its capabilities require.

An improved AI Engineering team may improve Security agents; Security may improve its red-team agents; stronger QA agents may design harder evaluations; Product agents may improve product/design agents; Mobility Intelligence may improve regulatory-research agents. The improvement system itself is therefore also eligible for governed improvement.

### 8A.7 Shadow → canary → promotion → rollback

A successful candidate initially receives **no additional authority**.

Where representative replay is insufficient, the promotion ladder should progress through bounded stages such as:

```text
candidate
  → offline / replay evaluation
  → adversarial + domain validation
  → shadow against real or representative work with no canonical/external mutation
  → bounded canary inside the candidate's existing authority ceiling
  → evidence review
  → governed promotion OR rejection
  → post-promotion monitoring
  → rollback / demotion if thresholds are violated
```

Existing autonomy evidence and promotion-policy owners should govern advancement wherever they already apply. Promotion changes the active capability version only after required independent evidence and an authorized governance/human decision. Promotion does **not** itself expand tool, credential, spending, external-action or organizational authority.

Production observations feed the next cycle. Poor candidates are rejected. Regressions trigger rollback/demotion according to the owning runtime. Successful improvements become versioned organizational knowledge with their evidence lineage preserved.

The mature organization should be able to answer a question such as:

> Agent v7 was proposed by AI/ML Engineering, implemented by Software Engineering, evaluated on a versioned 4,800-case suite by independent QA, red-teamed by Security, validated by its domain owner, admitted to shadow/canary under existing authority, promoted after the required evidence window, and replaced v6 because measured quality improved without violating cost, reliability or safety constraints.

That explanation must come from real durable evidence, not a generated narrative.

### 8A.8 Recursive improvement across all departments

GRSI applies to every AIOS department whose work can be evaluated with sufficiently trustworthy evidence:

- Engineering AI can design better coding, architecture and platform agents.
- Security AI can design better detection, triage and red-team agents.
- QA AI can improve evaluators, adversarial cases and regression strategies.
- Operations AI can improve case-work and evidence-processing agents.
- Mobility Intelligence AI can improve regulatory research and source-analysis agents.
- Product AI can improve research, design and product-management agents.
- Finance/economic agents can improve forecasting and resource-analysis agents subject to independent financial controls.
- Governance agents can improve review preparation and control evidence, but cannot weaken the governance authority that constrains them.

No department owns an exemption from independent evaluation merely because it is improving itself.

### 8A.9 Non-negotiable recursive-improvement prohibitions

An agent or candidate must never be able to improve itself by granting itself powers that were not separately authorized. In particular, an agent may not:

- grant itself new credentials, permissions, tools or data access;
- increase its own autonomy or authority ceiling;
- expand its own paid-resource or monetary allocation;
- self-fund or create an autonomous wallet/resource pool;
- rewrite governance/promotion policy to make its own candidate easier to approve;
- promote or activate its own candidate without the required independent evidence/decision;
- silently alter production or bypass the existing release/deployment boundary;
- bypass CI, security review, human-only gates or external-action controls;
- erase or rewrite failing evaluation evidence, incidents, corrections or parent lineage;
- redefine canonical truth through memory, prompt text or self-authored narrative;
- recursively create unbounded improvement WorkItems or agent teams without deduplication, budgets, termination conditions and queue/backpressure controls.

GRSI must improve the organization's **ability to produce good candidates and evidence**, not create a path around governance.

### 8A.10 AI Research & Improvement organization

Longer term, AIOS should be capable of expressing an internal AI Research & Improvement function using the existing organizational capability architecture before inventing new executive roles. The conceptual collaboration chain is:

```text
CTO / governed executive objective
  → AI Research / AI-ML Platform
  → Agent / Systems Architecture
  → AI / Software Engineering
  → QA / Evaluation
  → Security / Red Team
  → Domain Validation
  → GRC / Governance
  → Human / authorized promotion decision
```

A future Chief AI or dedicated AI Research organization is a capability-architecture decision, not a prerequisite for GRSI. First prove that existing CTO, Data & AI Engineering, Architecture, QA, Security, domain and governance owners cannot represent the required responsibility without ambiguity or overload.

GRSI should also be able to create **bounded temporary improvement teams** for a specific objective using existing work/assignment/governance mechanics. Team formation does not create new authority and terminates with the objective or its explicit continuation decision.

### 8A.11 Relationship to AUTO.LEARN, Phase 19 and Phase 20

`AUTO.LEARN` supplies measured observations and governed process-improvement proposals. Phase 19 supplies organizational learning, competency, reproducibility, correction/outcome and economic evidence. Phase 20 supplies earned-autonomy/resource-governance evidence. GRSI connects these to **versioned capability candidates and recursive generations**.

Those programmes are dependencies and evidence owners; GRSI must not duplicate their state.

The required semantic chain is:

```text
observed evidence
  → bounded improvement objective
  → candidate lineage
  → independent evaluation
  → cross-team validation
  → governed promotion decision
  → active version
  → production outcome evidence
  → next improvement objective
```

At every generation:

```text
CAPABILITY IMPROVEMENT != AUTHORITY EXPANSION
BETTER EVAL SCORE != PROMOTION
PROMOTION != NEW PERMISSION
PRODUCTION ACTIVITY != VERIFIED OUTCOME
VERIFIED OUTCOME != SELF-GRANTED RESOURCE AUTHORITY
```

### 8A.12 First implementation sequence

Do **not** begin GRSI by creating a new database subsystem or generic self-modifying-agent framework.

After the current document-storage recovery PR #269 is sealed/reconciled, the first GRSI slice is a read-only duplicate/gap audit of the existing canonical owners, including at minimum:

- `organization_contribution`;
- `organization_governed_work` and `organization_work`;
- `organization_decision` and relevant human-action/command boundaries;
- `organization_skill_registry`, `organization_skill_lifecycle`, assignment and audit;
- `organization_autonomy_profile`, evidence/evaluation and promotion policy;
- `organization_replay`;
- `organization_learning_reproducibility`;
- `organization_observatory` and existing quality/outcome signals;
- `organization_agent_lifecycle` and `organization_agent_runtime`;
- existing security, GRC, runtime-economics and release/proof owners relevant to candidate promotion.

Only concrete gaps should receive new durable state. The expected missing connective tissue is an **Improvement Proposal + Candidate Lineage** contract, but that must be proven by the audit rather than assumed in advance.

The planned bounded sequence is:

1. **GRSI.A — Canonical-owner duplicate/gap audit and invariant contract.** Map every required RSI concept to an existing owner or an explicit gap. No migration by assumption.
2. **GRSI.B — Improvement Proposal + Candidate Lineage.** Introduce only the minimal durable proposal/candidate/version/fingerprint/parent/hypothesis/acceptance lineage that existing owners cannot represent truthfully.
3. **GRSI.C — Independent Evaluation Campaign.** Bind candidates to immutable/versioned comparison evidence, evaluator independence, regression constraints and reproducibility.
4. **GRSI.D — Cross-Team Review Evidence.** Bind Security/Red Team, QA, domain, Platform/SRE and governance review requirements according to candidate risk class without inventing approval where none occurred.
5. **GRSI.E — Shadow and Canary Evidence.** Reuse real runtime/work boundaries to compare candidate behavior without granting new authority; keep shadow output non-canonical/non-external.
6. **GRSI.F — Governed Promotion / Rejection / Rollback.** Connect accepted evidence to the existing authorized decision/promotion/release boundaries and preserve exact active-version lineage.
7. **GRSI.G — Evidence-Triggered Improvement Objectives.** Allow observability/correction/economic/security signals to propose bounded improvement work with causal lineage, deduplication, budgets, termination and backpressure.
8. **GRSI.H — Recursive Improvement of the Improvement System.** Permit governed candidates for evaluators, benchmark generation, routing, team collaboration and improvement infrastructure itself, under the same independent-evidence and authority invariants.

GRSI.A must precede GRSI.B. No candidate may reach GRSI.E/F until the required Phase 16/17/19/20 runtime, security, economic, learning and authority dependencies for that candidate's risk class are actually proven.

### 8A.13 Definition of recursive maturity

AIOS reaches recursive-self-improvement maturity only when it can repeatedly demonstrate, from durable evidence, that:

1. it detected a real capability weakness or improvement opportunity;
2. it generated one or more versioned candidates without mutating the active capability;
3. independent evaluators and relevant specialist teams tested those candidates against versioned evidence;
4. governance/human authority admitted only an evidence-qualified candidate into bounded shadow/canary/promotion;
5. production evidence showed whether the promoted generation actually improved the intended outcome without unacceptable regressions;
6. that improved generation or its improved evaluation/engineering infrastructure materially contributed to the next improvement cycle;
7. authority, credentials, permissions, spending and consequential external-action rights remained separately governed throughout.

The destination is therefore:

> **AIOS → Self-Observing → Self-Evaluating → Self-Designing → Self-Testing → Self-Improving → Governed Promotion → Measured Production Learning → Repeat.**

The strategic objective is not merely **AI agents working for a company**. It is an **AI-native organization capable of progressively engineering a better version of its own AI organization while preserving human/governance control over authority and consequential action**.
'''

          text = text.replace(anchor, section + anchor, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit roadmap change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ROADMAP.md
          git diff --cached --check
          git commit -m "Add governed recursive self-improvement roadmap programme"
          git push origin HEAD:docs/governed-recursive-self-improvement-roadmap

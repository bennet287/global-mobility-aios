name: Populate pinned Plasma vendor snapshots

on:
  push:
    branches:
      - vendor/plasma-pinned-donors-v1

permissions:
  contents: write

jobs:
  populate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout donor branch
        uses: actions/checkout@v4
        with:
          ref: vendor/plasma-pinned-donors-v1
          fetch-depth: 0

      - name: Download and verify exact pinned archives
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp-plasma-vendor
          mkdir -p .tmp-plasma-vendor
          cd .tmp-plasma-vendor

          curl -fL --retry 3 -o wiki.zip \
            https://github.com/plasma-ai/wiki/archive/b27235fa11f1d3aa4deff50e45e52ea8ddc8af44.zip
          curl -fL --retry 3 -o fractal.zip \
            https://github.com/plasma-ai/fractal/archive/e629ae2b80250ab502feefe3d9d0266bc58f15b2.zip

          echo '96adfeff6b215294866e916520d71280fd1609da2506eeaded49c984b42f59a9  wiki.zip' | sha256sum -c -
          echo '64de38681085d2737019f9f9a8bbb3a4d997d4babc62eeec4667db2e076d9364  fractal.zip' | sha256sum -c -

          unzip -q wiki.zip -d wiki-src
          unzip -q fractal.zip -d fractal-src

      - name: Audit exclusions and import exact text/source trees
        shell: bash
        run: |
          set -euo pipefail

          WIKI_SRC="$(find .tmp-plasma-vendor/wiki-src -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          FRACTAL_SRC="$(find .tmp-plasma-vendor/fractal-src -mindepth 1 -maxdepth 1 -type d | head -n 1)"

          test -n "$WIKI_SRC"
          test -n "$FRACTAL_SRC"
          test -f "$WIKI_SRC/LICENSE"
          test -f "$FRACTAL_SRC/LICENSE"

          # The first Plasma Wiki pilot forbids executable repository-local wiki hooks.
          if find "$WIKI_SRC" -type f -path '*/.wiki/wiki.py' -print -quit | grep -q .; then
            echo 'Refusing import: Plasma Wiki archive contains .wiki/wiki.py executable hook.' >&2
            exit 1
          fi

          rm -rf vendor/plasma/wiki/v1.2.0/upstream
          rm -rf vendor/plasma/fractal/v1.1.0/upstream
          mkdir -p vendor/plasma/wiki/v1.2.0/upstream
          mkdir -p vendor/plasma/fractal/v1.1.0/upstream

          # Keep source, tests, docs and configuration. Exclude generated/cache material and
          # binary documentation artwork because it is not needed for donor-code inspection.
          rsync -a \
            --exclude='.git/' \
            --exclude='__pycache__/' \
            --exclude='.pytest_cache/' \
            --exclude='.mypy_cache/' \
            --exclude='.ruff_cache/' \
            --exclude='.venv/' \
            --exclude='venv/' \
            --exclude='dist/' \
            --exclude='build/' \
            --exclude='*.pyc' \
            --exclude='*.pyo' \
            --exclude='*.png' \
            "$WIKI_SRC/" vendor/plasma/wiki/v1.2.0/upstream/

          rsync -a \
            --exclude='.git/' \
            --exclude='__pycache__/' \
            --exclude='.pytest_cache/' \
            --exclude='.mypy_cache/' \
            --exclude='.ruff_cache/' \
            --exclude='.venv/' \
            --exclude='venv/' \
            --exclude='dist/' \
            --exclude='build/' \
            --exclude='*.pyc' \
            --exclude='*.pyo' \
            --exclude='*.png' \
            "$FRACTAL_SRC/" vendor/plasma/fractal/v1.1.0/upstream/

          cp "$WIKI_SRC/LICENSE" vendor/plasma/wiki/v1.2.0/LICENSE
          cp "$FRACTAL_SRC/LICENSE" vendor/plasma/fractal/v1.1.0/LICENSE

          # Build deterministic manifests for exactly what AIOS vendors.
          (
            cd vendor/plasma/wiki/v1.2.0/upstream
            find . -type f -print0 | sort -z | xargs -0 sha256sum
          ) > vendor/plasma/wiki/v1.2.0/SOURCE_MANIFEST.txt

          (
            cd vendor/plasma/fractal/v1.1.0/upstream
            find . -type f -print0 | sort -z | xargs -0 sha256sum
          ) > vendor/plasma/fractal/v1.1.0/SOURCE_MANIFEST.txt

          cat > vendor/plasma/wiki/v1.2.0/ARCHIVE_PROVENANCE.txt <<'EOF'
          upstream=plasma-ai/wiki
          version=1.2.0
          commit=b27235fa11f1d3aa4deff50e45e52ea8ddc8af44
          archive_sha256=96adfeff6b215294866e916520d71280fd1609da2506eeaded49c984b42f59a9
          license=Apache-2.0
          import_policy=frozen-read-only-donor
          binary_docs_artwork=excluded
          executable_dotwiki_hook=forbidden
          EOF

          cat > vendor/plasma/fractal/v1.1.0/ARCHIVE_PROVENANCE.txt <<'EOF'
          upstream=plasma-ai/fractal
          version=1.1.0
          commit=e629ae2b80250ab502feefe3d9d0266bc58f15b2
          archive_sha256=64de38681085d2737019f9f9a8bbb3a4d997d4babc62eeec4667db2e076d9364
          license=Apache-2.0
          import_policy=frozen-read-only-donor
          binary_docs_artwork=excluded
          EOF

          python scripts/check_repo_policy.py --root .
          echo 'Vendor footprint:'
          du -sh vendor/plasma
          echo 'Wiki imported files:'
          find vendor/plasma/wiki/v1.2.0/upstream -type f | wc -l
          echo 'Fractal imported files:'
          find vendor/plasma/fractal/v1.1.0/upstream -type f | wc -l

      - name: Remove one-shot importer and commit completed snapshots
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp-plasma-vendor
          rm -f .github/workflows/populate-plasma-vendor.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A vendor/plasma scripts/check_repo_policy.py .github/workflows/populate-plasma-vendor.yml

          if git diff --cached --quiet; then
            echo 'No vendor changes to commit.'
            exit 0
          fi

          git commit -m 'vendor: import pinned Plasma Wiki and Fractal source snapshots'
          git push origin HEAD:vendor/plasma-pinned-donors-v1

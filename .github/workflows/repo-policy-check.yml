name: Repository Policy Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  repo-policy-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check repository policy
        run: python scripts/check_repo_policy.py --root .

      - name: Check migration and roadmap consistency
        run: python scripts/check_release_consistency.py

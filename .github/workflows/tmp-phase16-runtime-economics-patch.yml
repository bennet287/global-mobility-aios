name: Temporary Phase 16 Runtime Economics Patch

on:
  push:
    branches:
      - phase16/runtime-economics-budget-metering

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase16/runtime-economics-budget-metering
          fetch-depth: 0
      - name: Apply bounded exact replacements
        shell: bash
        run: |
          printf '%s' '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
          python -m compileall -q apps/api/app/services/controlled_agents.py apps/api/app/tasks/agent_tasks.py apps/api/app/routers/controlled_agents.py
          git rm .github/workflows/tmp-phase16-runtime-economics-patch.yml
          git add apps/api/app/services/controlled_agents.py apps/api/app/tasks/agent_tasks.py apps/api/app/routers/controlled_agents.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Phase 16: enforce runtime economic gate [runtime-economics-patch]"
          git push origin HEAD:phase16/runtime-economics-budget-metering

name: Operator V2 Browser Proof

on:
  pull_request:
    paths:
      - "apps/web/app/page.tsx"
      - "apps/web/app/operator/v2/**"
      - "apps/web/components/v2/**"
      - "apps/web/lib/v2/operator-navigation.ts"
      - "apps/web/e2e/tests/operator-v2-acceptance.spec.ts"
      - ".github/workflows/operator-v2-browser-proof.yml"

permissions:
  contents: read

jobs:
  operator-v2-browser:
    name: Operator V2 targeted browser proof
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
      NEXT_PUBLIC_AUTH_ALLOW_HEADER_ROLE: "true"
      NEXT_PUBLIC_GMAI_ROLE: admin
      NEXT_PUBLIC_GMAI_USER: frontend-operator
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/web/e2e/package-lock.json

      - name: Install and build frontend
        working-directory: apps/web
        run: |
          npm ci
          npm run build

      - name: Install Chromium proof dependencies
        working-directory: apps/web/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Operator V2 targeted proof
        working-directory: apps/web/e2e
        run: npx playwright test tests/operator-v2-acceptance.spec.ts --project=chromium

      - name: Upload Operator V2 visible review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operator-v2-visible-review
          path: apps/web/e2e/operator-v2-artifacts
          if-no-files-found: error
          retention-days: 7

      - name: Upload Operator V2 failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: operator-v2-browser-failure-diagnostics
          path: apps/web/e2e/test-results
          if-no-files-found: error
          retention-days: 7

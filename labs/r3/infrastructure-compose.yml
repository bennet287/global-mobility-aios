services:
  openbao:
    image: openbao/openbao:2.6.2
    container_name: gmai-r3-openbao
    cap_add:
      - IPC_LOCK
    command:
      - server
      - -dev
      - -dev-root-token-id=r3-root-token
      - -dev-listen-address=0.0.0.0:8200
    environment:
      BAO_ADDR: http://0.0.0.0:8200
    ports:
      - "127.0.0.1:18200:8200"
    read_only: true
    tmpfs:
      - /tmp

  postgres:
    image: postgres:16-alpine
    container_name: gmai-r3-recovery-postgres
    environment:
      POSTGRES_USER: r3
      POSTGRES_PASSWORD: r3-synthetic-password
      POSTGRES_DB: r3_recovery
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U r3 -d r3_recovery"]
      interval: 2s
      timeout: 2s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data

x-application-runtime-env: &application_runtime_env
  APP_ENV: production
  LOG_LEVEL:
  DATABASE_URL: ${DATABASE_URL:?Set the production PostgreSQL URL}
  DATABASE_AUTO_CREATE_TABLES: "false"
  DATABASE_ECHO:
  REDIS_URL: ${REDIS_URL:?Set the production Redis URL}
  JWT_SECRET: ${JWT_SECRET:?Set the production signing secret}
  AUTOMATION_ENCRYPTION_KEY:
  AUTOMATION_WEBHOOK_SECRET:
  QDRANT_URL:
  QDRANT_COLLECTION:
  MINIO_ENDPOINT:
  MINIO_ACCESS_KEY:
  MINIO_SECRET_KEY:
  MINIO_BUCKET_DOCUMENTS:
  MINIO_SECURE:
  MINIO_AUTO_CREATE_BUCKET:
  MINIO_SERVER_SIDE_ENCRYPTION:
  DOCUMENT_STORAGE_BACKEND:
  DOCUMENT_LOCAL_STORAGE_DIR:
  DOCUMENT_UPLOAD_MAX_MB:
  DOCUMENT_ACCESS_TOKEN_SECRET:
  DOCUMENT_ACCESS_DEFAULT_TTL_SECONDS:
  DOCUMENT_ACCESS_MAX_TTL_SECONDS:
  DOCUMENT_ACCESS_DEFAULT_MAX_USES:
  DOCUMENT_ACCESS_MAX_USES:
  DOCUMENT_STORAGE_PRODUCTION_STRICT:
  DOCUMENT_STORAGE_ALLOW_LOCAL_IN_PRODUCTION:
  DOCUMENT_STORAGE_RETENTION_DAYS:
  DOCUMENT_STORAGE_BACKUP_STRATEGY:
  DOCUMENT_STORAGE_RECOVERY_TESTED_AT:
  OLLAMA_BASE_URL:
  DEFAULT_LOCAL_MODEL:
  TRUTH_ENGINE_STRICT_MODE:
  SOURCE_MONITOR_TIMEOUT_SECONDS:
  SOURCE_MONITOR_MAX_BYTES:
  SOURCE_MONITOR_ALLOW_HTTP:
  REGULATORY_MODEL_CLASSIFICATION_ENABLED:
  COVERAGE_TRANCHE_ASSISTANT_ENABLED:
  COVERAGE_TRANCHE_ASSISTANT_MAX_ITEMS:
  DOCLING_ENABLED:
  LLM_PROVIDER:
  DEEPSEEK_API_KEY:
  DEEPSEEK_MODEL:
  DEEPSEEK_BASE_URL:
  DEEPSEEK_MAX_OUTPUT_TOKENS:
  MOONSHOT_API_KEY:
  MOONSHOT_MODEL:
  MOONSHOT_BASE_URL:
  MOONSHOT_MAX_COMPLETION_TOKENS:
  GEMINI_API_KEY:
  GEMINI_MODEL:
  GEMINI_BASE_URL:
  LLM_TEMPERATURE:
  LLM_TIMEOUT_SECONDS:
  LLM_FALLBACK_TO_TEMPLATE:

services:
  postgres:
    image: postgres:16-alpine
    container_name: gmai-postgres-prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gmai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a production PostgreSQL password}
      POSTGRES_DB: ${POSTGRES_DB:-gmai}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-gmai} -d $${POSTGRES_DB:-gmai}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api-migrate:
    build:
      context: ./apps/api
    container_name: gmai-api-migrate-prod
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set the production PostgreSQL URL}
      DATABASE_AUTO_CREATE_TABLES: "false"
    depends_on:
      postgres:
        condition: service_healthy
    command: alembic -c alembic.ini upgrade head
    healthcheck:
      disable: true
    restart: "no"

  redis:
    image: redis:7-alpine
    container_name: gmai-redis-prod
    command: redis-server --appendonly yes
    volumes:
      - redis_prod_data:/data
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
    container_name: gmai-api-prod
    environment:
      <<: *application_runtime_env
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set the public web origin for CORS}
      AUTH_ENABLED: "true"
      AUTH_ADMIN_USERNAME:
      AUTH_ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD:?Set the production admin password}
      AUTH_SESSION_COOKIE:
      AUTH_SESSION_TTL_SECONDS:
      AUTH_ALLOW_HEADER_ROLE: "false"
      OTEL_ENABLED:
      OTEL_EXPORTER_OTLP_ENDPOINT:
      OTEL_SERVICE_NAME:
      OTEL_SERVICE_VERSION:
      CLAMAV_ENABLED:
      CLAMAV_HOST:
      CLAMAV_PORT:
      CLAMAV_TIMEOUT_SECONDS:
      CLAMAV_BLOCK_ON_SCANNER_ERROR:
      ALLOW_INTERNAL_DRAFT_PATHWAY_SIMULATION:
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      api-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      target: production
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?Set NEXT_PUBLIC_API_BASE_URL to the browser-reachable API origin}
        NEXT_PUBLIC_AUTH_ALLOW_HEADER_ROLE: "false"
    container_name: gmai-web-prod
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then((response)=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 5
    restart: unless-stopped

  ingress:
    image: caddy:2.11.4-alpine
    container_name: gmai-ingress-prod
    entrypoint: ["/bin/sh", "/etc/caddy/check-ingress-env.sh"]
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN:?Set WEB_DOMAIN to the public web hostname}
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN to the public API hostname}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/deployment/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./infrastructure/deployment/check-ingress-env.sh:/etc/caddy/check-ingress-env.sh:ro
      - ingress_data:/data
      - ingress_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ./apps/api
    container_name: gmai-worker-prod
    environment:
      <<: *application_runtime_env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      api-migrate:
        condition: service_completed_successfully
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=2
    healthcheck:
      disable: true
    restart: unless-stopped

  beat:
    build:
      context: ./apps/api
    container_name: gmai-beat-prod
    environment:
      APP_ENV: production
      REDIS_URL: ${REDIS_URL:?Set the production Redis URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      api-migrate:
        condition: service_completed_successfully
    command: celery -A app.core.celery_app beat --loglevel=info
    healthcheck:
      disable: true
    restart: unless-stopped

volumes:
  postgres_prod_data:
  redis_prod_data:
  ingress_data:
  ingress_config:

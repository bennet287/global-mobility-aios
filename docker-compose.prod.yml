services:
  postgres:
    image: postgres:16-alpine
    container_name: gmai-postgres-prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gmai}
      POSTGRES_PASSWORD_FILE: /run/secrets/aios/database/postgres_password
      POSTGRES_DB: ${POSTGRES_DB:-gmai}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - *database_secret_volume
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-gmai} -d $${POSTGRES_DB:-gmai}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api-migrate:
    image: global-mobility-aios-api:${AIOS_RELEASE_COMMIT_SHA:?Build through scripts/production_release_identity.py}-${AIOS_RELEASE_CONFIGURATION_FINGERPRINT:?Build through scripts/production_release_identity.py}
    build:
      context: ./apps/api
      args: *release_build_args
    container_name: gmai-api-migrate-prod
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set the production PostgreSQL URL}
      DATABASE_PASSWORD_REF: ${DATABASE_PASSWORD_REF:?Set the production PostgreSQL password reference}
      DATABASE_AUTO_CREATE_TABLES: "false"
    depends_on:
      postgres:
        condition: service_healthy
    command: alembic -c alembic.ini upgrade head
    volumes:
      - *database_secret_volume
    healthcheck:
      disable: true
    restart: "no"

  redis:
    image: redis:7-alpine
    container_name: gmai-redis-prod
    command: redis-server --appendonly yes
    volumes:
      - redis_prod_data:/data
    restart: unless-stopped

  api:
    image: global-mobility-aios-api:${AIOS_RELEASE_COMMIT_SHA:?Build through scripts/production_release_identity.py}-${AIOS_RELEASE_CONFIGURATION_FINGERPRINT:?Build through scripts/production_release_identity.py}
    build:
      context: ./apps/api
      args: *release_build_args
    container_name: gmai-api-prod
    environment:
      <<: *application_runtime_env
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set the public web origin for CORS}
      AUTH_ENABLED: "true"
      AUTH_ADMIN_USERNAME:
      AUTH_ADMIN_PASSWORD_REF: ${AUTH_ADMIN_PASSWORD_REF:?Set the production admin password reference}
      AUTH_SESSION_COOKIE:
      AUTH_SESSION_TTL_SECONDS:
      AUTH_ALLOW_HEADER_ROLE: "false"
      OTEL_ENABLED:
      OTEL_EXPORTER_OTLP_ENDPOINT:
      OTEL_SERVICE_NAME:
      OTEL_SERVICE_VERSION:
      CLAMAV_ENABLED:
      CLAMAV_HOST:
      CLAMAV_PORT:
      CLAMAV_TIMEOUT_SECONDS:
      CLAMAV_BLOCK_ON_SCANNER_ERROR:
      ALLOW_INTERNAL_DRAFT_PATHWAY_SIMULATION:
    volumes:
      - *database_secret_volume
      - *auth_secret_volume
      - *automation_secret_volume
      - *documents_secret_volume
      - *storage_secret_volume
      - *llm_secret_volume
      - *bootstrap_secret_volume
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      api-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    image: global-mobility-aios-web:${AIOS_RELEASE_COMMIT_SHA:?Build through scripts/production_release_identity.py}-${AIOS_RELEASE_CONFIGURATION_FINGERPRINT:?Build through scripts/production_release_identity.py}
    build:
      context: ./apps/web
      target: production
      args:
        <<: *release_build_args
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?Set NEXT_PUBLIC_API_BASE_URL to the browser-reachable API origin}
        NEXT_PUBLIC_AUTH_ALLOW_HEADER_ROLE: "false"
    container_name: gmai-web-prod
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then((response)=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 5
    restart: unless-stopped

  ingress:
    image: caddy:2.11.4-alpine
    container_name: gmai-ingress-prod
    entrypoint: ["/bin/sh", "/etc/caddy/check-ingress-env.sh"]
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN:?Set WEB_DOMAIN to the public web hostname}
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN to the public API hostname}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/deployment/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./infrastructure/deployment/check-ingress-env.sh:/etc/caddy/check-ingress-env.sh:ro
      - ingress_data:/data
      - ingress_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped

  worker:
    image: global-mobility-aios-api:${AIOS_RELEASE_COMMIT_SHA:?Build through scripts/production_release_identity.py}-${AIOS_RELEASE_CONFIGURATION_FINGERPRINT:?Build through scripts/production_release_identity.py}
    build:
      context: ./apps/api
      args: *release_build_args
    container_name: gmai-worker-prod
    environment:
      <<: *application_runtime_env
    volumes:
      - *database_secret_volume
      - *auth_secret_volume
      - *automation_secret_volume
      - *documents_secret_volume
      - *storage_secret_volume
      - *llm_secret_volume
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      api-migrate:
        condition: service_completed_successfully
    command:
      - /bin/sh
      - -ec
      - |
        python -c 'from app.core.startup_safety import validate_production_worker_settings; validate_production_worker_settings()'
        exec celery -A app.core.celery_app worker --loglevel=info --concurrency=2
    healthcheck:
      disable: true
    restart: unless-stopped

  beat:
    image: global-mobility-aios-api:${AIOS_RELEASE_COMMIT_SHA:?Build through scripts/production_release_identity.py}-${AIOS_RELEASE_CONFIGURATION_FINGERPRINT:?Build through scripts/production_release_identity.py}
    build:
      context: ./apps/api
      args: *release_build_args
    container_name: gmai-beat-prod
    environment:
      APP_ENV: production
      REDIS_URL: ${REDIS_URL:?Set the production Redis URL}
      CELERY_BEAT_SCHEDULER_ONLY: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      api-migrate:
        condition: service_completed_successfully
    command: celery -A app.core.celery_app beat --loglevel=info
    healthcheck:
      disable: true
    restart: unless-stopped

volumes:
  postgres_prod_data:
  redis_prod_data:
  ingress_data:
  ingress_config:

services:
  postgres:
    image: postgres:16-alpine
    container_name: gmai-postgres-prod
    env_file:
      - .env.production
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gmai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-postgres-password}
      POSTGRES_DB: ${POSTGRES_DB:-gmai}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-gmai} -d $${POSTGRES_DB:-gmai}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api-migrate:
    build:
      context: ./apps/api
    container_name: gmai-api-migrate-prod
    env_file:
      - .env.production
    environment:
      DATABASE_AUTO_CREATE_TABLES: "false"
    depends_on:
      postgres:
        condition: service_healthy
    command: alembic -c alembic.ini upgrade head
    healthcheck:
      disable: true
    restart: "no"

  redis:
    image: redis:7-alpine
    container_name: gmai-redis-prod
    command: redis-server --appendonly yes
    volumes:
      - redis_prod_data:/data
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
    container_name: gmai-api-prod
    env_file:
      - .env.production
    environment:
      DATABASE_AUTO_CREATE_TABLES: "false"
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      api-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      target: production
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?Set NEXT_PUBLIC_API_BASE_URL to the browser-reachable API origin}
        NEXT_PUBLIC_AUTH_ALLOW_HEADER_ROLE: "false"
    container_name: gmai-web-prod
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then((response)=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 5
    restart: unless-stopped

  worker:
    build:
      context: ./apps/api
    container_name: gmai-worker-prod
    env_file:
      - .env.production
    environment:
      DATABASE_AUTO_CREATE_TABLES: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      api-migrate:
        condition: service_completed_successfully
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=2
    healthcheck:
      disable: true
    restart: unless-stopped

  beat:
    build:
      context: ./apps/api
    container_name: gmai-beat-prod
    env_file:
      - .env.production
    environment:
      DATABASE_AUTO_CREATE_TABLES: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      api-migrate:
        condition: service_completed_successfully
    command: celery -A app.core.celery_app beat --loglevel=info
    healthcheck:
      disable: true
    restart: unless-stopped

volumes:
  postgres_prod_data:
  redis_prod_data:

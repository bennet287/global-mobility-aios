services:
  api:
    build:
      context: ./apps/api
    container_name: gmai-api
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
      - ./knowledge:/knowledge:ro
    depends_on:
      - postgres
      - redis
      - qdrant
      - minio
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./apps/api
    container_name: gmai-worker
    env_file: .env
    volumes:
      - ./apps/api:/app
      - ./knowledge:/knowledge:ro
    depends_on:
      - postgres
      - redis
      - api
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=2

  web:
    build:
      context: ./apps/web
    container_name: gmai-web
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    depends_on:
      - api
    command: npm run dev -- --hostname 0.0.0.0 --port 3000

  postgres:
    image: postgres:16-alpine
    container_name: gmai-postgres
    environment:
      POSTGRES_USER: gmai
      POSTGRES_PASSWORD: gmai_password
      POSTGRES_DB: gmai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: gmai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: gmai-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  minio:
    image: minio/minio:latest
    container_name: gmai-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  n8n:
    image: n8nio/n8n:latest
    container_name: gmai-n8n
    env_file: .env
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - api

  # Optional local LLM service. Start with:
  # docker compose --profile local-ai up ollama
  ollama:
    image: ollama/ollama:latest
    container_name: gmai-ollama
    profiles: ["local-ai"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  minio_data:
  n8n_data:
  ollama_data:

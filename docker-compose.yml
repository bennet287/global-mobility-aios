services:
  api:
    build:
      context: ./apps/api
    container_name: gmai-api
    env_file: .env.docker
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
      - ./knowledge:/knowledge:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio:
        condition: service_started
      api-migrate:
        condition: service_completed_successfully
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  api-migrate:
    build:
      context: ./apps/api
    container_name: gmai-api-migrate
    env_file: .env.docker
    depends_on:
      postgres:
        condition: service_healthy
    command: alembic -c alembic.ini upgrade head
    healthcheck:
      disable: true
    restart: "no"

  worker:
    build:
      context: ./apps/api
    container_name: gmai-worker
    env_file: .env.docker
    volumes:
      - ./apps/api:/app
      - ./knowledge:/knowledge:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api-migrate:
        condition: service_completed_successfully
      api:
        condition: service_started
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=2
    healthcheck:
      disable: true

  beat:
    build:
      context: ./apps/api
    container_name: gmai-beat
    env_file: .env.docker
    volumes:
      - ./apps/api:/app
      - ./knowledge:/knowledge:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api-migrate:
        condition: service_completed_successfully
      api:
        condition: service_started
    command: celery -A app.core.celery_app beat --loglevel=info
    healthcheck:
      disable: true

  web:
    build:
      context: ./apps/web
    container_name: gmai-web
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
      NEXT_PUBLIC_AUTH_ALLOW_HEADER_ROLE: "true"
      NEXT_PUBLIC_GMAI_ROLE: admin
      NEXT_PUBLIC_GMAI_USER: frontend-operator
      NEXT_DIST_DIR: .next-docker
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next-docker
    depends_on:
      - api
    command: npm run dev -- --hostname 0.0.0.0 --port 3000

  postgres:
    image: postgres:16-alpine
    container_name: gmai-postgres
    environment:
      POSTGRES_USER: gmai
      POSTGRES_PASSWORD: gmai_password
      POSTGRES_DB: gmai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gmai -d gmai"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: gmai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  qdrant:
    image: qdrant/qdrant:latest
    container_name: gmai-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  minio:
    image: minio/minio:latest
    container_name: gmai-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  n8n:
    image: n8nio/n8n:latest
    container_name: gmai-n8n
    env_file: .env.docker
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - api

  # Optional local LLM service. Start with:
  # docker compose --profile local-ai up ollama
  ollama:
    image: ollama/ollama:latest
    container_name: gmai-ollama
    profiles: ["local-ai"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  minio_data:
  n8n_data:
  ollama_data:

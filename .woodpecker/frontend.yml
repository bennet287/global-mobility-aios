when:
  - event: pull_request
  - event: push
    branch: main
  - event: manual

steps:
  - name: frontend-tests-types-build
    image: node:24-bookworm
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
      NEXT_PUBLIC_AUTH_ALLOW_HEADER_ROLE: "true"
      NEXT_PUBLIC_GMAI_ROLE: admin
      NEXT_PUBLIC_GMAI_USER: frontend-operator
    commands:
      - cd apps/web
      - npm ci
      - |
          audit_attempt=1
          while :; do
            audit_output=""
            audit_status=0
            if audit_output="$(npm audit --audit-level=high 2>&1)"; then
              audit_status=0
            else
              audit_status=$?
            fi
            printf '%s\n' "$audit_output"
            if [ "$audit_status" -eq 0 ]; then
              break
            fi
            if printf '%s\n' "$audit_output" | grep -Eqi '503 Service Unavailable|502 Bad Gateway|504 Gateway Timeout|ECONNRESET|ETIMEDOUT|EAI_AGAIN'; then
              if [ "$audit_attempt" -ge 3 ]; then
                echo "npm audit failed after 3 transient-registry attempts"
                exit "$audit_status"
              fi
              echo "Transient npm audit registry failure; retrying attempt $((audit_attempt + 1))/3"
              sleep $((audit_attempt * 5))
              audit_attempt=$((audit_attempt + 1))
              continue
            fi
            exit "$audit_status"
          done
      - npm run test:design-foundation
      - npm run test:request-auth
      - npx tsc --noEmit
      - npm run build
      - npm run test:compiled-auth

  - name: live-organization-browser-e2e
    image: mcr.microsoft.com/playwright:v1.62.1-noble
    environment:
      CI: "true"
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
      NEXT_PUBLIC_AUTH_ALLOW_HEADER_ROLE: "true"
      NEXT_PUBLIC_GMAI_ROLE: admin
      NEXT_PUBLIC_GMAI_USER: frontend-operator
    commands:
      - cd apps/web/e2e
      - npm ci
      - |
          audit_attempt=1
          while :; do
            audit_output=""
            audit_status=0
            if audit_output="$(npm audit --audit-level=high 2>&1)"; then
              audit_status=0
            else
              audit_status=$?
            fi
            printf '%s\n' "$audit_output"
            if [ "$audit_status" -eq 0 ]; then
              break
            fi
            if printf '%s\n' "$audit_output" | grep -Eqi '503 Service Unavailable|502 Bad Gateway|504 Gateway Timeout|ECONNRESET|ETIMEDOUT|EAI_AGAIN'; then
              if [ "$audit_attempt" -ge 3 ]; then
                echo "npm audit failed after 3 transient-registry attempts"
                exit "$audit_status"
              fi
              echo "Transient npm audit registry failure; retrying attempt $((audit_attempt + 1))/3"
              sleep $((audit_attempt * 5))
              audit_attempt=$((audit_attempt + 1))
              continue
            fi
            exit "$audit_status"
          done
      - npm test
